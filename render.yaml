databases:
  - name: primary-school-quiz-v7-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "18"

services:
  - type: web
    name: primary-school-quiz-v7
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: primary-school-quiz-v7-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_HOURS
        value: "12"
      - key: REMEMBER_TOKEN_DAYS
        value: "30"

# Gemini Code Assist configuration for Freeman Three-Brain review PRs.
# Source of truth: docs/three-brain/gemini/config.yaml (copied into .gemini/ on review branches).
have_fun: false
ignore_patterns:
  - ".three-brain/**"
code_review:
  disable: false
  comment_severity_threshold: LOW
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: false

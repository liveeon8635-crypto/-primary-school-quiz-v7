name: merge-evaluator-dispatch

on:
  workflow_run:
    workflows: ["automation-boundary-guard"]
    types: [completed]

permissions:
  contents: read

jobs:
  dispatch:
    name: dispatch-one-shot-merge-evaluator
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      startsWith(github.event.workflow_run.head_branch, 'freeman-') &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch signed one-shot evaluation
        env:
          FREEMAN_EVENT_HMAC_SECRET: ${{ secrets.FREEMAN_EVENT_HMAC_SECRET }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');

          (async () => {
            const secret = String(process.env.FREEMAN_EVENT_HMAC_SECRET || '');
            const repository = String(process.env.REPOSITORY || '');
            const workflowRunId = Number(process.env.WORKFLOW_RUN_ID);
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = String(process.env.HEAD_SHA || '').toLowerCase();
            const headBranch = String(process.env.HEAD_BRANCH || '');

            if (secret.length < 32) throw new Error('FREEMAN_EVENT_HMAC_SECRET is not configured');
            if (repository !== 'liveeon8635-crypto/-primary-school-quiz-v7') throw new Error('repository denied');
            if (!Number.isInteger(workflowRunId) || workflowRunId < 1) throw new Error('invalid workflow run id');
            if (!Number.isInteger(prNumber) || prNumber < 1) throw new Error('invalid PR number');
            if (!/^[a-f0-9]{40}$/.test(headSha)) throw new Error('invalid head SHA');
            if (!headBranch.startsWith('freeman-')) throw new Error('head branch is not evaluator-owned');

            const payload = JSON.stringify({
              repository,
              workflow_run_id: workflowRunId,
              pr_number: prNumber,
              head_sha: headSha
            });
            const signature = 'sha256=' + crypto
              .createHmac('sha256', secret)
              .update(payload, 'utf8')
              .digest('hex');
            const delivery = `${workflowRunId}:${headSha}`;

            const response = await fetch('https://freeman-agent.onrender.com/internal/github/merge-evaluator', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'x-freeman-signature': signature,
                'x-freeman-delivery': delivery
              },
              body: payload,
              signal: AbortSignal.timeout(15000)
            });

            const responseText = (await response.text()).slice(0, 2000);
            if (!response.ok) {
              throw new Error(`merge evaluator rejected dispatch: HTTP ${response.status} ${responseText}`);
            }

            console.log(JSON.stringify({
              event: 'MERGE_EVALUATOR_DISPATCHED',
              repository,
              workflowRunId,
              prNumber,
              headSha,
              headBranch,
              responseStatus: response.status
            }));
          })().catch(error => {
            console.error(String(error?.message || error));
            process.exitCode = 1;
          });
          NODE

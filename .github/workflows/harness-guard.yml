name: Harness Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HARNESS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HARNESS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HARNESS_BRANCH: ${{ github.head_ref }}
      HARNESS_PR_TITLE: ${{ github.event.pull_request.title }}
      HARNESS_PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run harness guard
        run: python scripts/harness_guard.py

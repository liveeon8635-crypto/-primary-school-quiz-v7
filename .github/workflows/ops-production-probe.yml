name: Production Probe

on:
  push:
    branches: [ops-probe-render-168]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe health
        run: |
          set -euxo pipefail
          curl --fail --show-error --silent --max-time 12 https://primary-school-quiz-v7.onrender.com/health
          echo
          curl --fail --show-error --silent --max-time 12 https://primary-school-quiz-v7.onrender.com/v1 >/dev/null
